version: "2"
run:
  go: "1.27"
output:
  formats:
    text:
      path: stdout
linters:
  enable:
    - bodyclose
    - durationcheck
    - errorlint
    - gosec
    - misspell
    - nilerr
    - unconvert
    - unparam
    - wastedassign
  disable:
    - depguard
    - exhaustruct
    - funlen
    - gocognit
    - gocyclo
    - godox
    - ireturn
    - lll
    - nlreturn
    - wrapcheck
  settings:
    errcheck:
      check-type-assertions: true
      check-blank: false
    gosec:
      excludes:
        - G104
        - G304
    govet:
      disable:
        - shadow
    misspell:
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - gosec
          - unparam
        path: _test\.go
      - linters:
          - unparam
        text: always receives
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 50
  max-same-issues: 10
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
